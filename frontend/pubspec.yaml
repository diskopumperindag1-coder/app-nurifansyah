name: frontend
description: "Portal Publik Flutter dengan GoRouter dan Multibahasa"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.0
  http: ^1.2.0
  provider: ^6.1.2
  intl: any
  shared_preferences: ^2.3.2
  flutter_widget_from_html: ^0.15.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
